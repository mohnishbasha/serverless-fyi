pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,mjs,astro,json,md,mdx,css,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,ts,mjs,astro}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    markdownlint:
      glob: '*.{md,mdx}'
      run: pnpm exec markdownlint-cli2 {staged_files}
    cspell:
      glob: '*.{md,mdx,astro}'
      run: pnpm exec cspell --no-progress {staged_files}
    secrets:
      run: git diff --cached | grep -E '(BEEHIIV_API_KEY=.+|sk-[A-Za-z0-9]{20,})' && exit 1 || exit 0
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test:unit
