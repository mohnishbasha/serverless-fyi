# listmonk + PostgreSQL + Caddy + nightly backup. Run from this directory:
#   cp .env.example .env && $EDITOR .env && docker compose up -d
name: listmonk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

  app:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./listmonk --install --idempotent --yes --config '' &&
      ./listmonk --upgrade --yes --config '' &&
      ./listmonk --config ''"
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__user: ${POSTGRES_USER}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: ${POSTGRES_DB}
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - uploads:/listmonk/uploads
    networks:
      - internal # reachable only by caddy; no published ports

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache aws-cli >/dev/null
        echo "backup loop started; nightly at $${BACKUP_HOUR_UTC:-03}:15 UTC"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "$$(date -u +%Y-%m-%d) $${BACKUP_HOUR_UTC:-03}:15:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          /backup.sh || echo "BACKUP FAILED at $$(date -u)" >&2
        done
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_KMS_KEY_ID: ${BACKUP_KMS_KEY_ID}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-03}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    volumes:
      - ./backup.sh:/backup.sh:ro
    networks:
      - internal

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
