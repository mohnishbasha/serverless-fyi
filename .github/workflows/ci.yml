name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_URL: https://www.serverless.fyi
  BASE_PATH: /
  PUBLIC_INDEXABLE: 'true'
  # Kit (ADR-028). CI uses a placeholder form id; e2e mocks the network. Deploys use repo variables.
  PUBLIC_NEWSLETTER_PROVIDER: kit
  PUBLIC_NEWSLETTER_ID: ci-placeholder-form
  # Exercised by e2e (network mocked); Lighthouse blocks Google's hosts so scores measure our code only.
  PUBLIC_GA_MEASUREMENT_ID: G-DKDHH7T239
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm build
      - run: pnpm validate # content + parity + seo + feeds + dist (assets, sitemap, agent endpoints) + html-validate
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist, retention-days: 7, include-hidden-files: true }

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same image scripts/update-snapshots.sh uses, so visual snapshots match pixel-for-pixel (ADR-023).
    # Keep the tag equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - name: E2E + a11y + visual (update snapshots only on PRs labelled update-snapshots)
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}" == "true" ]]; then
            pnpm test:e2e --update-snapshots
          else
            pnpm test:e2e
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      - if: contains(github.event.pull_request.labels.*.name, 'update-snapshots')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: updated-snapshots, path: tests/visual/__snapshots__, retention-days: 7 }

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - run: pnpm exec lhci autorun
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7, include-hidden-files: true }

  spec-touch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Behavior change must update docs/
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          code=$(echo "$changed" | grep -E '^(src/(lib|layouts|components|pages)|integrations|astro.config)' || true)
          docs=$(echo "$changed" | grep -E '^docs/' || true)
          if [ -n "$code" ] && [ -z "$docs" ] && ! grep -q 'no-spec-change' <<< "$LABELS"; then
            echo "::error::Behavior files changed without a docs/ update. Update the spec or add label 'no-spec-change' with justification."
            exit 1
          fi

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: PR title is a Conventional Commit (squash-merge subject)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | pnpm exec commitlint

  licenses:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: THIRD_PARTY_LICENSES.md is current
        run: |
          pnpm licenses:gen
          git diff --exit-code THIRD_PARTY_LICENSES.md || { echo "::error::Run 'pnpm licenses:gen' and commit THIRD_PARTY_LICENSES.md"; exit 1; }
      - run: pnpm audit --prod --audit-level high
