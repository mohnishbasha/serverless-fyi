      - any-glob-to-any-file:
          [
            '.github/**',
            'astro.config.mjs',
            'package.json',
            'pnpm-lock.yaml',
            'integrations/**',
            'infra/**',
            '*.config.*',
            'lighthouserc.json',
            'lychee.toml',
          ]
