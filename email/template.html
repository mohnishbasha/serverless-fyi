<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{title}}</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fbfaf7;
      font-family:
        system-ui,
        -apple-system,
        'Segoe UI',
        Roboto,
        Arial,
        sans-serif;
      color: #15181c;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #fbfaf7">
      <tr>
        <td align="center" style="padding: 24px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 640px; background: #ffffff; border: 1px solid #dcd8ce; border-radius: 12px"
          >
            <tr>
              <td style="padding: 28px 28px 8px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 13px;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    color: #9a4a07;
                    font-weight: 700;
                  "
                >
                  2 Minute Serverless
                </p>
                <h1 style="margin: 0 0 20px; font-size: 28px; line-height: 1.2">{{title}}</h1>
                {{tldr}}
                <div style="font-size: 17px; line-height: 1.65">{{content}}</div>
                <p style="margin: 28px 0 0">
                  <a href="{{url}}" style="color: #0b4f7a; font-weight: 700">Read on the web →</a>
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 28px 28px;
                  font-size: 13px;
                  line-height: 1.5;
                  color: #4b5561;
                  border-top: 1px solid #dcd8ce;
                "
              >
                You are receiving this because you subscribed to 2 Minute Serverless at serverless.fyi.<br />
                <a href="{{ UnsubscribeURL }}" style="color: #4b5561">Unsubscribe</a> ·
                <a href="{{ ManageURL }}" style="color: #4b5561">Manage preferences</a><br />
                Serverless Ventures LLC · TODO(owner): physical mailing address (required by CAN-SPAM)
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
